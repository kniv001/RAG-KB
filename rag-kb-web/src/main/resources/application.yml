server:
  port: 8080
  shutdown: graceful
  # 只监听本机 —— 对外一律经 Cloudflare 隧道，不开任何入站端口
  address: 127.0.0.1
  tomcat:
    threads:
      max: 50
      min-spare: 5

spring:
  application:
    name: rag-kb
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ragkb
    username: ${KB_DB_USER:ragkb}
    # 密码不进仓库：启动脚本从 data/pgapp.txt 读出后作为环境变量注入
    password: ${KB_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: ragkb-pool

  data:
    redis:
      host: ${KB_REDIS_HOST:127.0.0.1}
      port: ${KB_REDIS_PORT:6379}
      password: ${KB_REDIS_PASSWORD:}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 认证走自定义的 JWT 过滤器 + users 表，不再使用 Spring Boot 的内存用户

# ---------------- 端到端加密 ----------------
# Cloudflare 会终止 TLS，因此能读到经它转发的明文。开启本层后链路上只见密文。
# 边界：前端 JS 本身也由 CF 分发，所以这层「防偷看」但不「防使坏（替换 JS）」——
# 完整端到端需要客户端由自己控制（桌面端 / App）。
ragkb:
  # **信息流方向**（`news` 分支）：周期性抓取的新闻/热搜等外部信息。
  # 两个相似度阈值都是**临时值**，依据不是拍脑袋，而是两张表上记下来的分布：
  #   feed_segments.best_sim（段与库里最近段落的相似度）→ dup-sim
  #   feed_items.nearest_topic_sim（条目与最近议题质心的相似度）→ topic-sim
  # **先跑一批看分布，再定阈值**（与 Simhash.DUP_DISTANCE 由 nearest_dist 校准同规矩）。
  feed:
    dup-sim: ${KB_FEED_DUP_SIM:0.92}
    dup-ratio-demote: ${KB_FEED_DUP_RATIO:0.8}
    topic-sim: ${KB_FEED_TOPIC_SIM:0.80}
    topic-window-days: ${KB_FEED_TOPIC_WINDOW:7}
    enrich-limit: ${KB_FEED_ENRICH_LIMIT:30}

  crypto:
    enabled: ${KB_CRYPTO_ENABLED:true}
    # 同样必须绝对。用相对路径时它侥幸落在项目目录，但那只是因为
    # RsaKeyService 的 @PostConstruct 恰好早于 Web 容器启动 ——
    # 顺序一变就会和 storage.root 一样跑进临时 docbase，而密钥一旦每次重启重生成，
    # 所有 access token 立刻失效、客户端缓存的公钥也全部作废。
    key-dir: ${KB_KEY_DIR:D:/vs/rag-kb-java/data/keys}
    rsa-key-size: 3072
    timestamp-tolerance-seconds: 300
    nonce-check: true
    nonce-ttl-seconds: 600

  # ---------------- 双令牌 ----------------
  # Access 是无状态 JWT：验签即用、零查询，代价是签发后无法撤回 → TTL 给短。
  # Refresh 是不透明随机串托管在 Redis：可主动吊销，所以登出/改密才真正生效。
  jwt:
    secret: ${KB_JWT_SECRET:}          # 留空则首次启动生成并写入 secret-file
    secret-file: data/keys/jwt-secret.txt
    issuer: rag-kb
    access-ttl-seconds: 1800           # 30 分钟
    refresh-ttl-seconds: 2592000       # 30 天
    login-max-fails: 10
    login-lock-seconds: 900
    refresh-cookie-name: kb_refresh
    refresh-cookie-path: /api/auth     # 限定路径，减少 Cookie 暴露面

  # ---------------- 存储 ----------------
  storage:
    # 必须是绝对路径，绝不能用 "." 之类的相对路径。
    #
    # 实测踩过的坑：写 "." 时它没有解析到启动目录，而是解析到了
    # %TEMP%\tomcat-docbase.<端口>.<随机数>\ —— Spring Boot 起 Web 容器时会把
    # user.dir 指向那个临时 docbase，而 StorageProperties 的 @PostConstruct
    # 正好在它之后执行。每次启动都是一个新目录，于是**上一次启动上传的文件
    # 全部失联**（库里 stored_path 还在，文件却找不到了）。
    # 机器上堆积了约 80 个这样的目录，每个都带着一份孤立的 uploads。
    #
    # 指向 Python 版仓库是刻意的：两套系统共用一个数据库，文件也该共用 ——
    # 已有的文档就是 Python 版上传的，指过去它们立刻就能重新索引。
    root: ${KB_STORAGE_ROOT:D:/vs/rag-kb}
    uploads-dir: data/uploads
    max-upload-mb: 50

  # ---------------- 切分 ----------------
  # 与 Python 版保持一致：两套系统共用一个库，切分口径不同会导致同一篇文档
  # 在两边的检索结果对不上。
  chunk:
    size: 600            # 目标字符数，中文按字计
    overlap: 80          # 相邻块重叠，避免答案恰好被切在边界
    min-size: 80         # 小于此长度的块丢弃

  # ---------------- RAG 管线 ----------------
  rag:
    top-k: 6
    max-distance: 0.60
    rerank-pool: 30
    default-mode: hybrid
    # 模型不在这里配 —— 唯一来源是下方 ragkb.provider.default-chat / default-embed。
    # 曾经两处都配，改了 A 忘了改 B 就会出现「配置明明改了、跑的却是旧模型」。
    # Agentic RAG：规划 → 检索 → 评估 →（不足则换查询再来）→ 生成
    # agent 只是控制流，事实来源始终只有检索到的资料
    agent:
      enabled: true
      max-rounds: 2           # 实测 3 轮会把耗时推到 160s+，而多召回收益很小
      # 规划/评估强制结构化输出（关思考 + 语法约束 JSON）—— 实测 plan 51.5s → 0.94s
      # 关掉可回到「模型先想几千 token 再吐 JSON」的旧行为，仅用于对照
      structured-output: true
      # 把模型的思考过程流式推给前端。首个思考帧只要 0.2~2.5s，而首个正文帧要 12~46s ——
      # 不推的话用户就是对着黑屏干等。总耗时不变，只是把黑屏换成可见的进度。
      stream-thinking: true
      # 给思考一个**会终止的形状**（条目化 + 写满就进正文）。默认关：
      # 实测 decode 里 79~87% 的 token 是思考，而回答路径的 think 不能关
      # （think:false 会把推理转进正文污染输出）—— 所以只能约束形状。
      # 开之前必须先有答案侧的质量对照（tools/eval.py），不能只看速度。
      shape-thinking: ${KB_SHAPE_THINKING:false}
      # 把语境行随资料一起给模型（每块一句「本段可回答：…」）。
      # 思考的大头是逐条扫描召回块（15 段 ≈ 700 token decode），
      # 而语境行本来就在库里、只差没给模型 —— 代价是 prefill（快 50 倍）。
      ctx-in-prompt: ${KB_CTX_IN_PROMPT:false}
      # 两段式：第一段用 format 语法约束把"想"挤进固定 schema（关思考），
      # 第二段照分析直接写。语法约束是唯一能截断"换措辞说十几遍"那个循环的东西。
      two-stage: ${KB_TWO_STAGE:false}
      # 类型判定改由代码给（用 Jev 式读概率判定，不再让模型"先判断属于哪一类"），
      # 并顺带取代那步从不改变结果的 ③ 评估。
      # 2026-09-22 默认开：TTFT 中位 4.1→2.6s（两次独立实验一致）、总耗时 −23~25%、
      # 思考 −20~25%；质量 repeat-5 配对 3胜2平0负（p=0.25，只能说"不低于"）；
      # 真正显著的是"不再复述类别"：标签泄漏 7/105 → 0/105（Fisher p≈0.014）。
      # 回退：把这里或环境变量设成 false 即可，一行。
      contract-in-code: ${KB_CONTRACT_IN_CODE:true}
      # 推理时不许复述【参考资料】原文（默认关）。
      # 依据：思考里**中位 38% 的字能对上注入材料里的某一句话**（4~45%，由题型决定），
      # 且集中在前 1/3（40%/36%/24%）—— 那些字已经在提示词里，再写一遍不产生新信息。
      # 天花板：全消掉 ⇒ 思考 −38% ⇒ 总耗时 −8s 左右。
      # ⚠️ 与已判死的五次不同类：那五次是**形状**约束，这条是**内容禁止**。
      # 但"读一遍"可能正是组织答案的必要过程 ⇒ **速度和质量都要量**才能转正。
      no-restate: ${KB_NO_RESTATE:false}
      # **地址计划**（默认关）：给参考资料里每句话一个地址 ⟨块号.句号⟩，并要求推理时
      # 用地址指代、不要抄原句。依据：思考里中位 **38%** 的字是在复述已经在提示词里的资料。
      # ⚠️ 与 `no-restate` **不是同一件事**：那条只有"禁止"（实测思考反而变长 p=0.007），
      # 这条是"**先给替代、再要求用**"——正是"只禁止不给替代 ⇒ 模型换个方式做同一件事"的应用。
      # 依赖 sentences 表（python tools/build-sentences.py）；表空时退回整块并打日志。
      sent-addr: ${KB_SENT_ADDR:false}
      # **分层注入**（**默认开**，2026-09-23 转正）：块召回之后只在那些块里按问题挑句，
      # 只装挑中的那几句进提示词。
      # 依据：块 top-12 → 句 top-20 保留靶子内容 30.6%、精度 36.8%（整块 21.9%）、
      # 每题 1416 字（整块 6339 字）；而答案只覆盖被引用块内容的 14%（中位）。
      #
      # **转正复验（21 题 × 2 次配对，两次同向）**：
      #   装入 token 3781/3748 → 2647/2347（**−30%/−37%**，20/21 题更低 —— 机制性）
      #   生成 token 1788/1611 → 1963/1938（**+10%/+20%**，16/21、15/21 更高）
      #   总耗时 26.0/22.7s → 26.2/23.5s（符号 10:11、9:12 ⇒ **没变长**）
      #   质量：缺陷率两臂一致（`走对了出口` 各 2/12）；全通过 19/21 vs 18/21，
      #         差的那题是**罕见回声**（把提示词里的来源行抄进正文，历史 45 次运行 0/879）
      # ⚠️ **机制假说被自己的复验推翻**：原本指望"少给资料 ⇒ 少想"，实测**思考 +16~19%**。
      #   真实账是**提示词 token 换成了思考 token**：省下的 1134 个 prefill token 只值 0.3s
      #   （3800 tok/s），多生成的 ~175 个 decode token 值 2.2s（80 tok/s），
      #   两边被"上下文变短 ⇒ decode 速率 +5~10 tok/s"抵掉 ⇒ **时间不变**。
      #   ⇒ 这条的价值是**上下文预算**（少占 1134 token 窗口、离 12288 悬崖更远），不是省时间。
      # ⚠️ 依赖 `sentences` 表（`python tools/build-sentences.py`，一条命令 113 秒）；
      #   表空 / 语料戳过期 / 这块切不出句子 ⇒ **退回整块并打日志**，不会静默变少。
      sent-window: ${KB_SENT_WINDOW:true}
      sent-window-m: ${KB_SENT_M:20}
      # **逐块挑句**（0 = 关，走上面的全局 top-20）：每块各出自己最相关的 k 句。
      # 动机是全局 LIMIT M 的一个形状问题 —— **没挤进前 M 名的块一句都拿不到**，
      # 于是落到"注入整块"那条退路（那是给"表没建/戳过期/切不出句子"准备的）：
      # 实测平均 **2.0 段/次**、29/43 次调用至少一段 ⇒ **最相关的块被截成几句、
      # 最不相关的块反而装全文**。逐块挑句后每个有句子的块至少出一句。
      # 预算是"块数 × k"，所以 k 要实测（token + 质量）后再定。
      sent-chunk-k: ${KB_SENT_CHUNK_K:0}
      # **Jev 选择题**（默认关）：一次前向读出「哪一段最能直接回答这个问题」，注进那段标头。
      # 判断用"读"比用"写"便宜 50 倍（前向 3800 tok/s vs decode 77）；读概率不只 A/B 还能读选择题
      # ——首 token 分布里本来就有全部编号的概率，一次前向 ~0.15s（逐块问是/否要 N 次 ~1.8s）。
      # 依据：锚到块号的思考占 37%，其中"判断/指路"9~25%。⚠️ 只标正向（标「否」会伤多跳题）。
      # ⚠️ 先例是负的：ctx-in-prompt（同样"预先告诉每段是什么"）实测思考没变（p=0.585）。
      jev-pick: ${KB_JEV_PICK:false}
      # 注入闸门：最高概率低于它就**不注入**（多半在猜，注进去就是误导）。
      # 依据：选中的段与"没注入时臂A引用的段"比对，6 道里相同 4 次（P 全 ≥0.65）、
      # 不同 2 次恰好是 P 最低的两次（0.55/0.54）。取 0.70 留余量。
      jev-pick-min-p: ${KB_JEV_PICK_MIN_P:0.70}
      # 检索不到资料时仍让模型作答：先说明知识库没有、再用通用知识回答并标注清楚。
      # 关掉则退回「不调模型、直接回一句资料中没有相关内容」，秒回但毫无帮助。
      answer-without-context: true
      # 提示词预算。超限不是渐进退化而是悬崖：实测 num_ctx=10240 时 9920 token 正常，
      # 再多一点 Ollama 就把整个上下文重置到 5122 token 并**丢掉开头**——
      # 也就是系统提示词。那样回答不再受任何约束，而模型照常返回看起来正常的回答、不报错。
      # prompt-window-tokens 必须与 provider 那边的 num-ctx 一致。
      #
      # 2026-09-17 从 10240 提到 16384。**可用上限不等于该取的值**：
      # 实测两模型同驻可用到 24576~28672，但 16384 的注入预算（≈11k token）已经远超
      # 检索能拿出的材料（当前 3 条查询 × 8 段 = 24 段 ≈ 7.3k token），
      # 而显存余量能从 552MiB 回到约 1.4G —— 越过那道墙不是变慢一点，
      # 是生成从 ~95 tok/s 掉到 ~10 tok/s。要用更多材料时再往上调。
      # 换机器或桌面占用变化后必须重测（tools/joint-ceiling-v2-probe.py）。
      prompt-window-tokens: ${KB_PROMPT_WINDOW:16384}
      generation-reserve-tokens: 4096   # 留给思考与正文
      trim-keep-turns: 4                # 超预算时最少保留几轮最近历史
      queries-per-round: 3
      # 2026-09-17 A/B 实测（top-k 4→8、上限 12→24）：引用来源数 3.4→5.0（+47%）、
      # 答案长 550→678 字、说「知识库中没有」1 题→0 题；严格判据（答案重现文档专有词）
      # 只 +0.5 点，属噪声级 —— 改善是真的但不夸张。配套窗口见下方 prompt-window-tokens。
      #
      # **2026-09-20 试过 8 → 16，又退回 8**。理由如下（教训比结论值钱）：
      #   · 复刻路径（只有向量 + RRF、且**复用同一批规划器查询**）：8 → 36%、**16 → 72%**，+36 点
      #   · **真实链路**（进提示词的那一批，n=25）：8 → 52%、**16 → 56%**，**只差 1 道题 = 噪声**
      # 差在哪：真实路径还有**关键词通道 + 历史召回 + 主题树**，多出来的候选**没把靶子挤进来**，
      # 只是把名额填满（进提示词的段数中位 **13 → 22**，12/25 道题占满 24 个名额）。
      # 而复刻里没有这些通道，所以把 top-k 的收益**高估**了。
      # ⇒ 收益未证实（噪声级）、代价确定（每题多约 5k token）⇒ **退回 8**。
      # 留着 `${KB_TOP_K}` 覆盖，下次要复测不用重新编译。
      top-k-per-query: ${KB_TOP_K:8}
      max-contexts: 24        # 与上面解耦：这个才是"装进提示词几段"，上面是"每条查询看多宽"
      # 规划与评估用的模型；留空表示与主模型相同。
      # 本机刻意留空：主模型已经是 4b（够小、能与向量模型共存），
      # 再引入第三个模型只会让它被挤出显存、掉到 CPU 上跑，反而更慢。
      # 在显存充裕的机器上（或改用云端 API）可以填一个更小的模型来提速。
      utility-model: ${KB_UTILITY_MODEL:}

    # 会话历史索引：超出最近窗口的旧轮次不再整段丢弃，而是向量化后按需召回。
    # 压缩比约 2.2 万倍（KV 每 token 147KB vs 向量每 600 token 4KB）。
    # 注意它是「增量」—— 窗口内的近轮次仍是原文全文，不受检索质量影响，
    # 所以最坏情况是退回到改造前的行为，而不是丢掉本来有的东西。
    history:
      enabled: true
      top-k: 4              # 每次召回几条旧消息（邻接上下文额外带，不计入）
      excerpt-chars: 1200   # 注入提示词的字符上限，约 900 token
      index-batch: 64       # 单次补索引上限，防止老会话首次触发时卡住请求

    # 轮次笔记：把一轮对话改写成自包含的一段话，**索引的是它而不是原文**。
    # 单条 message 不是好的检索单元 —— 用户那句常带指代（「那它呢」），
    # 助手那句常脱离问题，两边都夹着「根据参考资料[1]」这类包装。
    # 只改写窗口之外的轮次：窗口内的原文本来就在提示词里，改了是重复劳动。
    # window-messages 必须与 HISTORY_LIMIT 和 summary.window-messages 取同一个值，
    # 否则同一条消息会以「原文」和「笔记」两种形态同时出现在提示词里。
    turn-doc:
      enabled: true
      window-messages: 16
      batch-messages: 4    # 一次后台任务改写几轮，攒批是为了少占推理槽

    # 语境行：给每块生成一句「这段能回答什么问题」，**只进检索索引、不进提示词**。
    #
    # 2026-09-18 难题集实测（tools/hard-query-probe.py + contextual-retrieval-probe.py）：
    # 问句用**症状词**（「怎么让服务固定在同一台机器上」），文档用**机制词**
    # （「节点亲和性」「调度」），两者在向量空间里够不着 —— 那条的靶子排在 rank 50，
    # 加宽召回也没用（要提到 50 才行）。加上语境行后回到 rank 28，难题 13/14 → 14/14。
    # 免费的办法试过了：只把文档标题前置**完全没用**（标题带的还是机制词）。
    #
    # 代价：入库时每块 1 次 4b 调用（661 块约 20 分钟，后台 + 按内容哈希缓存，
    # 重建索引时几乎瞬间）；查询侧**零开销** —— 语境行只影响"能不能被召回"。
    context:
      # 入库时为每块生成一行「这段能回答什么问题」，拼在正文前一起做嵌入（只进索引，不进提示词）。
      #
      # **2026-09-20 用多跳尺子（tools/multihop-probe.py，25 题 / 4 篇）复测 —— 有效**：
      #   带 ctx：k=12 **68%** / k=24 84%　难题集 **14/15**
      #   不带：  k=12 **56%** / k=24 80%　难题集 **13/15**
      #   ⇒ **+12 点 = 3 道题**（n=25 时 ±1 题 = 4 点，远超噪声）
      #
      # **量的时候踩过一个坑，记下来**：第一版探针的靶子匹配把键取到了 `ctx + 正文` 的开头，
      # 于是"带 ctx"和"不带 ctx"两次测的**靶子集根本不是同一批**，量出来是"无差别"甚至倒挂。
      # 把键改成**只取正文**之后，效应立刻显形。**先确认两次测的是同一件事，再比数。**
      # （同一天还量过另两种形态：仅语境行 k=24 掉到 48% —— 信号确实主要在正文；
      #   RRF 融合无稳定增益 —— 现在的"拼接"就是够用的融合方式。）
      #
      # 成本：全量重建**冷缓存约 270s、热缓存 41s**；不带 ctx 是 24s（新文档入库属于冷的那一类）。
      enabled: ${KB_CTX_ENABLED:true}

    # 会话滚动摘要：历史索引漏召时的兜底。检索只给 top-k，召不回就丢了，
    # 而且没有第二次机会（「那它呢」尤其召不回定义「它」的那一轮）。
    # 摘要覆盖全部历史，粗糙但不会完全丢，与索引互补。
    summary:
      enabled: true
      window-messages: 16   # 与 ChatService.HISTORY_LIMIT 一致：窗口内的原文不进摘要，避免重复
      batch-messages: 6     # 攒够 6 条（三轮）才更新一次，否则每轮都要调一次模型

    # 主题树：把全部块聚成若干主题簇，每簇一句概括。
    # 解决的是「语料一大，扁平的 top-k 就看不出全局」—— 检索不到时只能回
    # 「知识库中没有」，而说不出「没有 X，但有 Y 和 Z 两个相关方向」。
    # 只做两层不做深树：深树的收益来自逐层收窄，而每下降一层都要付 KV，
    # 在 10240 的上下文预算下不划算；两层的收益已拿到绝大部分。
    tree:
      enabled: true
      max-clusters: 12        # 簇数上限（实际簇数由 √(n/2) 决定，这里只是封顶）
      samples-per-cluster: 5  # 每簇挑几条代表去概括，概括不需要读全文
      # 收窄检索范围到最相关的几个主题簇。0 = 不收窄。
      # 默认关：聚类按向量距离分，不懂语义，万一把相关的块分到了别的簇，
      # 收窄就是把正确答案挡在门外 —— 而这是静默失败。语料小的时候风险大于收益。
      narrow-to-clusters: 0
      # 把主题概览注入提示词。它是固定前缀，实测前缀复用能把重复部分的
      # prefill 从 819ms 降到 44ms，所以常驻的代价很小。
      inject-overview: true
      overview-chars: 700     # 概览字数上限，防止主题太多挤爆上下文

  # ---------------- 联网搜索 ----------------
  # 默认关：这个功能会让服务端主动向外发起请求，与「只监听本机」的默认姿态
  # 不同，应当由用户明确打开。关着时 /api/web/** 一律拒绝，前端入口也不显示。
  web:
    enabled: ${KB_WEB_ENABLED:false}
    # 后端顺序，第一个有结果的胜出。只能调顺序 —— 加新后端要同时写解析逻辑。
    # 实测（校园网，查「三层缓存架构」）：Bing 把「三层」拆成单字「三」返回汉字
    # 百科页（加 mkt、换 cn.bing.com 都一样），360 则准确且给出真实网址；
    # 英文查询反过来 Bing 正常。所以两个都留着互相兜底。
    # 搜狗结果最准，但链接是解不出目标地址的 JS 跳转，入库拿不到出处，只能弃用。
    backends:
      - so360
      - bing
    timeout-seconds: 20
    max-page-bytes: 2000000
    max-results: 8
    fetch-delay-ms: 400            # 连续抓取的间隔，别把对端当压测目标
    max-text-chars: 60000          # 单篇正文上限，太长切分与向量化都吃不消

    # 可选的检索来源。选了某个就在那个站里搜（拼 site: 限定），不选则全网。
    # 这份清单是**实测可达**的站点，不是拍脑袋列的 —— 同一台机器上
    # 维基百科 DNS 被污染 + SNI 阻断、百度百科返回 403 反爬页、
    # 搜狗百科给拦截页、StackOverflow 连不上，所以都没列进来。
    sources:
      - { label: 360百科,      domain: baike.so.com }
      - { label: 中国大百科,   domain: zgbk.com }
      - { label: CSDN,         domain: blog.csdn.net }
      - { label: 博客园,       domain: cnblogs.com }
      - { label: 掘金,         domain: juejin.cn }
      - { label: 思否,         domain: segmentfault.com }
      - { label: 知乎,         domain: zhihu.com }
      - { label: MDN,          domain: developer.mozilla.org }
      # 维基百科列在这里是为了「可达之后能直接用」，now 抓不动：
      # 本机所在网络对它做了 DNS 污染（返回 Twitter/Facebook 的段）+
      # 按 SNI 阻断 TLS（拿真实 IP 直连也握不上手），DoH 也全不通。
      - { label: 维基百科,     domain: wikipedia.org, note: "本机网络不可达（DNS 污染 + SNI 阻断）" }

  # ---------------- GPU 调度 ----------------
  # 本机只有一块 GPU，Ollama 只有一个推理槽（OLLAMA_NUM_PARALLEL=1），请求 FIFO 排队。
  # 实测后台任务跑 3091ms 时，用户请求要等 3095ms —— 等满；而用户请求本身只要 192ms。
  # 所以后台任务（滚动摘要、历史改写）必须在用户静默时才允许开始。
  gpu:
    quiet-seconds: 20      # 用户静默这么久，后台任务才可以开始
    max-wait-seconds: 300  # 等超过这么久就放弃本次 —— 增量的活，下次再说
    poll-millis: 500

  # ---------------- 模型提供方 ----------------
  # 本地与云端同一套接口，运行时可切。引用格式 providerId/model（用斜杠，
  # 因为模型名本身常含冒号：qwen3:8b）。
  # 加一家新服务只要补一段配置 —— DeepSeek / 通义 / Moonshot / 智谱 /
  # 硅基流动 / OpenAI / vLLM / LM Studio 都是 OpenAI 兼容，不用改代码。
  provider:
    # 为什么用 4b 而不是 8b —— 这是本机显存约束逼出来的结论，不是随意选的：
    #   GPU 8GB，桌面占用约 3GB，实际可用约 4.9GB。
    #   · qwen3:4b(3.9GB) + bge-m3(664MB) = 4.6GB → 两者同时常驻，交替调用 0.03 秒
    #   · qwen3:8b 装不下 → 与向量模型互相驱逐，每次切换重载 4-8 秒；
    #     更糟的是三者同载时它会被挤到纯 CPU，单次调用从 20 秒劣化到 50 秒
    # 换更大模型前先确认真实显存够不够，否则会以「模型更强」的名义大幅变慢。
    default-chat: local/qwen3:4b
    default-embed: local/bge-m3
    timeout-seconds: 300               # 本地大模型推理慢，给足
    stream-idle-seconds: 120
    providers:
      local:
        kind: ollama
        label: 本地 Ollama
        base: http://127.0.0.1:11434
        # 与 OLLAMA_FLASH_ATTENTION=1 + OLLAMA_KV_CACHE_TYPE=q4_0 配套（见 docs/ollama-tuning.md）。
        #
        # 2026-09-17 重测后从 10240 提到 16384。判据：生成全速 **且** 向量调用延迟 30~100ms
        # （而不是数千毫秒）——`ollama ps` 的显存字段在 embed 模型上不可信，它会报 0% 却在 GPU 上跑。
        # 2026-09-19 服务端 KV 从 q8_0 降到 q4_0（每 token 76.7 → 40.7 KB）：同一天配对实测，
        # 两模型同驻的墙从 32768 推到 49152（q8 在 49152 只剩 11 tok/s，q4 是 100 tok/s）。
        # **这里没有跟着往上抬**：容量有了但没有仪器能把它换成收益（两门检索基准都在天花板），
        # 而解码随上下文变长会变慢（13K 上下文实测 46~50 tok/s）。要用更多材料时再往上调。
        #
        # **墙的位置随桌面显存占用浮动**：跨天的绝对值不可比（09-17 量到 q8 下 32768 崩，
        # 09-19 同一个 q8 在 32768 是好的）。要论证档位或配置的作用，**必须同一天配对测**。
        # 另外：反复换档位的探针会留下孤儿 llama-server 占显存，症状是下次加载掉 CPU
        # （`ollama ps` 显示 96%/4%）而日志无错 —— 跑完探针用 `Get-Process llama-server` 确认是 0。
        num-ctx: 16384
        # **单次回复的硬上限（跑飞保险丝）** —— 此前是 0（不限制），于是一次跑飞
        # 把显卡占住了 7 分钟以上：Ollama 日志 `slot context shift, n_keep = 4,
        # n_discard = 8189` 反复出现 —— 已经越过 num_ctx 在丢窗口继续生成，
        # 而**没有任何一层会喊停**（`stream-idle` 是"两个 chunk 之间的空闲超时"，
        # 跑飞时 token 一直在流 ⇒ 它永远不会触发）。
        #
        # 实测（15 次真实问答的生成 token）：中位 1848、最大 4133；那次跑飞到了 **25756+**。
        # 取 8192 = 最大正常值的 2 倍、跑飞的 1/3 —— 只在病态时才咬。
        # 取值同时要和 agent 的 `generation-reserve-tokens: 4096` 一起看：
        # 那个 4096 是**提示词预算**的预留（防上下文越界），不是生成上限，两者别混。
        #
        # ⚠️ **残留风险（写清楚，别当它解决了）**：要保证"生成不越过上下文"，
        # 需要 `提示词 + num_predict ≤ num_ctx`。实测提示词 3606~6303 ⇒ 8192+6303 < 16384，
        # 安全；但**预算允许提示词长到 12288**，那种极长提示词下仍会触发 context shift。
        # 真正干净的做法是按 `num_ctx − 估计提示词长度` 动态给 num_predict（还没做）。
        num-predict: ${KB_NUM_PREDICT:8192}
        chat-models:
          # 只有 qwen3:4b 能在本机 8GB 显存上与 bge-m3 同时常驻；其余几个是
          # 8b 级别，实测装进来就会把向量模型挤出去（切换重载 2~4 秒）。
          # 列在这里是给显存更宽裕的机器备选，选之前先确认真的放得下。
          - qwen3:4b
          - qwen3:8b
          - qwen3.5:9b
          - llama3.1:8b
        embed-models:
          - bge-m3
      deepseek:
        kind: openai
        label: DeepSeek API
        base: https://api.deepseek.com/v1
        api-key: ${KB_DEEPSEEK_KEY:}
        chat-models:
          - deepseek-chat
          - deepseek-reasoner
        embed-models: []

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线前改成 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  # **落盘，别只发控制台**：WARN 级的那几条正是"人眼仪器"——
  # 「只增不删补回」「数字可能被吃掉末位」「合并三次都少于原有条目」。
  # 控制台在 `Start-Process -WindowStyle Hidden` 启动时直接丢掉（2026-09-20 踩过：
  # 想查判据响过没有，发现日志文件停在两天前）。
  file:
    name: data/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  level:
    root: INFO
    com.kniv.ragkb: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
