server:
  port: 8080
  shutdown: graceful
  # 只监听本机 —— 对外一律经 Cloudflare 隧道，不开任何入站端口
  address: 127.0.0.1
  tomcat:
    threads:
      max: 50
      min-spare: 5

spring:
  application:
    name: rag-kb
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ragkb
    username: ${KB_DB_USER:ragkb}
    # 密码不进仓库：启动脚本从 data/pgapp.txt 读出后作为环境变量注入
    password: ${KB_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: ragkb-pool

  data:
    redis:
      host: ${KB_REDIS_HOST:127.0.0.1}
      port: ${KB_REDIS_PORT:6379}
      password: ${KB_REDIS_PASSWORD:}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 【临时】JWT 双令牌模块落地后删除这一段，改由 users 表 + {bcrypt} 校验。
  # {noop} 前缀表示明文比对 —— 只因为这是本地开发用的临时账号。
  # 注意必须加引号：YAML 里 { 是流式映射的起始符，不引会被解析成对象。
  security:
    user:
      name: ${KB_ADMIN_USER:dev}
      password: '{noop}${KB_ADMIN_PASSWORD:dev-only-change-me}'
      roles: ADMIN

# ---------------- 端到端加密 ----------------
# Cloudflare 会终止 TLS，因此能读到经它转发的明文。开启本层后链路上只见密文。
# 边界：前端 JS 本身也由 CF 分发，所以这层「防偷看」但不「防使坏（替换 JS）」——
# 完整端到端需要客户端由自己控制（桌面端 / App）。
ragkb:
  crypto:
    enabled: ${KB_CRYPTO_ENABLED:true}
    key-dir: data/keys
    rsa-key-size: 3072
    timestamp-tolerance-seconds: 300
    nonce-check: true
    nonce-ttl-seconds: 600

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线前改成 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.kniv.ragkb: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
